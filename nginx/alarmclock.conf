# Reverse-Proxy fuer die AlarmClock-Weboberflaeche.
# Nur im lokalen Netzwerk gedacht: kein TLS, keine Anmeldung.
# Nicht per Portweiterleitung direkt aus dem Internet erreichbar machen.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Muss zum MAX_CONTENT_LENGTH in webserver.py passen (32 MiB fuer MP3-Uploads).
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
